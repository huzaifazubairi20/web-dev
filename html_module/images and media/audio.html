<!DOCTYPE html>
<html>
    <head>
        <title>AUDIO</title>
    </head>

    <body>
        <p><h3>HERE IS HOW WE CAN ADD AUDIOS IN A WEBPAGE</h3></p>
        <audio controls loop>
            <source src="name.mp3" type="audio/mpeg">
        </audio>

        <p><h3>HERE IS HOW WE CAN ADD VIDEOS IN A WEBPAGE</h3></p>
        <video width="350" height="450" controls poster="rocket.img" loop>
            <source src="Demo.mp4" type="video/mp4">
        </video>
    </body>
</html>
